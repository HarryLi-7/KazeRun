name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build & Verify (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'bridge/requirements.txt'

      - name: Verify Code Cleanliness & Privacy Guardrails
        run: |
          ./scripts/verify_clean.sh

      - name: Verify Python Dependencies Resolution
        run: |
          python3 -m pip install --upgrade pip
          pip install -r bridge/requirements.txt

      - name: Display Swift & Xcode Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build Swift Release Binary
        run: |
          swift build -c release

      - name: Package macOS App Bundle
        run: |
          ./scripts/build_app.sh

      - name: Sanity Check App Bundle Structure
        run: |
          test -d "dist/KazeRun.app"
          test -x "dist/KazeRun.app/Contents/MacOS/KazeRun"
          test -f "dist/KazeRun.app/Contents/Info.plist"
          test -f "dist/KazeRun.app/Contents/Resources/sidecar/kaze_bridge.py"
          echo "✓ dist/KazeRun.app verified successfully."
